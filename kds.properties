# =============================================================================
#  TapTill KDS - app configuration
#
#  This is the ONLY file you normally need to edit to point the app at a
#  different URL, rename it, or release a new version.
#  Full guide: docs/CHANGE-URL-AND-REBUILD.md
# =============================================================================

# Web address the app opens. Must start with https://
# Notifications, location, camera and the other browser features are only
# enabled for pages on this same host.
KDS_URL=https://pos.narayanipauroti.com.np/kds

# Scope: the part of the site that counts as "the app" (same idea as "scope" in
# the PWA manifest). Notifications, location, camera, printing, downloads etc.
# only work on pages under this address; KDS_URL must be inside it.
# Leave empty to use the whole site of KDS_URL (e.g. https://pos.example.com/).
KDS_SCOPE=https://pos.narayanipauroti.com.np/

# Screen size: the page layout width in CSS pixels.
#   auto  = let the web page decide (its own <meta name="viewport">). On most TVs
#           the page then sees a 960x540 screen, whatever the TV's resolution.
#   1470  = the page sees the same width as a 13" MacBook Air browser window
#           (5 KOT tickets per row), scaled to fill any TV - 720p, 1080p or 4K.
#   1920  = like a Full-HD desktop browser: more tickets per row, smaller text.
#   1280  = fewer, bigger tickets (easier to read from far away).
VIEWPORT_WIDTH=1470

# Remote control:
#   false = arrow keys and OK go straight to the web page (use this when the KDS
#           UI already supports TV-remote navigation). A mouse still works.
#   true  = arrows move an on-screen pointer and OK clicks (for pages that are
#           not remote-friendly).
REMOTE_POINTER=false

# Name shown under the icon on the TV home screen and in Settings > Apps.
APP_NAME=TapTill KDS

# Version. Every release you install over an older one needs a HIGHER
# VERSION_CODE (whole number: 2, 3, 4, ...). VERSION_NAME is free text for humans.
VERSION_CODE=4
VERSION_NAME=1.3.0
