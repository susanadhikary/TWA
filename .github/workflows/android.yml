name: Build Android TV APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KDS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KDS_KEYSTORE_PASSWORD: ${{ secrets.KDS_KEYSTORE_PASSWORD }}
          KDS_KEY_ALIAS: ${{ secrets.KDS_KEY_ALIAS }}
          KDS_KEY_PASSWORD: ${{ secrets.KDS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KDS_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build unsigned release APK
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::notice::Signing secrets not set - release APK is unsigned (see README to add KDS_KEYSTORE_* secrets)."
          ./gradlew --no-daemon assembleRelease

      # TEMPORARY: hand the unsigned release APK to the signing step outside CI.
      - name: Export unsigned release APK
        if: ${{ env.KEYSTORE_BASE64 == '' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/export/"
          cd "$RUNNER_TEMP/export"
          git init -q -b apk-export-tmp
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Unsigned release APK ${{ github.sha }} (temporary)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk-export-tmp

      - uses: actions/upload-artifact@v4
        with:
          name: taptill-kds-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
