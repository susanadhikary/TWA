name: Build Android TV APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kds_url:
        description: "Optional: build for a different https:// URL (leave empty to use kds.properties)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KDS_KEYSTORE_BASE64 }}
      # Extra Gradle args; set when a URL is given on a manual run.
      GRADLE_ARGS: ${{ inputs.kds_url != '' && format('-PKDS_URL={0}', inputs.kds_url) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon $GRADLE_ARGS assembleDebug

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KDS_KEYSTORE_PASSWORD: ${{ secrets.KDS_KEYSTORE_PASSWORD }}
          KDS_KEY_ALIAS: ${{ secrets.KDS_KEY_ALIAS }}
          KDS_KEY_PASSWORD: ${{ secrets.KDS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KDS_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon $GRADLE_ARGS assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build unsigned release APK
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::notice::Signing secrets not set - release APK is unsigned (see README to add KDS_KEYSTORE_* secrets)."
          ./gradlew --no-daemon $GRADLE_ARGS assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: taptill-kds-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
