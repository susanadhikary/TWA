name: Build Android TV APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KDS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # TEMPORARY: fetch the PWA manifest + icons (not reachable from the dev sandbox).
      - name: Fetch PWA manifest and icons
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/export/pwa"
          cd "$RUNNER_TEMP/export/pwa"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = "https://pos.narayanipauroti.com.np/manifest.webmanifest"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 TapTillKDS-build"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()
          raw = get(base)
          open("manifest.webmanifest", "wb").write(raw)
          m = json.loads(raw)
          for i, icon in enumerate(m.get("icons", [])):
              url = urllib.parse.urljoin(base, icon["src"])
              name = f"{i:02d}_" + os.path.basename(urllib.parse.urlparse(url).path)
              try:
                  open(name, "wb").write(get(url))
                  print("got", name, icon.get("sizes"), icon.get("purpose"))
              except Exception as e:
                  print("FAILED", url, e)
          PY
          cd "$RUNNER_TEMP/export"
          git init -q -b apk-export-tmp
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "PWA manifest and icons (temporary)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk-export-tmp

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KDS_KEYSTORE_PASSWORD: ${{ secrets.KDS_KEYSTORE_PASSWORD }}
          KDS_KEY_ALIAS: ${{ secrets.KDS_KEY_ALIAS }}
          KDS_KEY_PASSWORD: ${{ secrets.KDS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KDS_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build unsigned release APK
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::notice::Signing secrets not set - release APK is unsigned (see README to add KDS_KEYSTORE_* secrets)."
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: taptill-kds-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
